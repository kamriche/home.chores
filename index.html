<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive home chores manager for families and roommates">
  <title>Home Chores</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js" onload="lucide.createIcons({attrs:{width:18,height:18}})"></script>
</head>
<body>
<div id="hearth-demo" data-theme="light" aria-label="Home chores app demo">


<div class="hc-shell">

<aside class="hc-side"><div class="hc-brand"><span class="hc-logo"><i data-lucide="house" aria-hidden="true"></i></span>hearth<span style="color:var(--hc-accent)">.</span></div><div class="hc-house-wrap"><button type="button" class="hc-house" id="hc-house-switcher" aria-label="Switch shared space" aria-expanded="false"><span><span class="hc-label">OUR SHARED SPACE</span><strong id="hc-house-name">Maple House</strong><span class="hc-label" id="hc-house-info"></span><span class="hc-label" id="hc-house-owner"></span></span><i data-lucide="chevrons-up-down" aria-hidden="true"></i></button><section id="hc-house-menu" class="hc-house-menu" aria-label="Shared spaces" hidden></section></div><nav aria-label="Main navigation"><button class="hc-nav" data-view="chores" aria-current="page"><i data-lucide="circle-check" aria-hidden="true"></i>Chores</button><button class="hc-nav" data-view="planning"><i data-lucide="calendar-days" aria-hidden="true"></i>Planning</button><button class="hc-nav" data-view="people"><i data-lucide="users" aria-hidden="true"></i>People</button><button class="hc-nav" data-view="home"><i data-lucide="house" aria-hidden="true"></i>Our home</button></nav><div class="hc-side-bottom"><div class="hc-label">A little together, every day.</div><p style="font-size:12px;margin-top:8px">A happier home starts with a shared load.</p></div></aside>
<main class="hc-main"><div class="hc-top"><span><span id="hc-current-house-breadcrumb">Maple House</span> / <span id="hc-breadcrumb">Chores</span></span><div class="hc-top-actions"><div class="hc-theme"><span id="hc-theme-state">Light</span><button type="button" id="hc-theme-toggle" role="switch" aria-checked="false" aria-label="Dark theme"><span class="hc-theme-track" aria-hidden="true"><span class="hc-theme-thumb"></span></span></button></div><div class="hc-notification-wrap"><button type="button" id="hc-notification-button" aria-label="Notifications" aria-expanded="false"><i data-lucide="bell" aria-hidden="true"></i><span id="hc-notification-count" hidden></span></button><section id="hc-notifications" class="hc-notifications" aria-label="Notification center" hidden></section></div><div class="hc-user-wrap"><button type="button" id="hc-user-button" class="hc-profile" aria-label="Open user menu" aria-expanded="false"><span class="hc-avatar">J</span><span>Jamie</span><i data-lucide="chevron-down" aria-hidden="true"></i></button><section id="hc-user-menu" class="hc-user-menu" aria-label="User menu" hidden><div class="hc-user-summary"><span class="hc-avatar">J</span><span><strong>Jamie</strong><small>Household account</small></span></div><button type="button" data-user-action="profile"><i data-lucide="user-round" aria-hidden="true"></i> My profile</button><button type="button" data-user-action="people"><i data-lucide="users" aria-hidden="true"></i> Manage all people</button><button type="button" data-user-action="notifications"><i data-lucide="bell" aria-hidden="true"></i> Notification preferences</button></section></div></div></div><div id="hc-content"></div><div id="hc-feedback" class="hc-feedback" aria-live="polite"></div></main>
</div>
<script>
(()=>{
const root=document.getElementById('hearth-demo'),content=root.querySelector('#hc-content');
root.querySelector('#hc-theme-toggle').addEventListener('click',e=>{const dark=root.dataset.theme!=='dark';root.dataset.theme=dark?'dark':'light';e.currentTarget.setAttribute('aria-checked',String(dark));root.querySelector('#hc-theme-state').textContent=dark?'Dark':'Light'});
const types=['Kitchen','Bathroom','Living room','Bedroom','Dining room','Office','Laundry room','Hallway','Balcony','Garden','Other'];
const icons={'Kitchen':'cooking-pot','Bathroom':'bath','Living room':'sofa','Bedroom':'bed-double','Dining room':'utensils','Office':'monitor','Laundry room':'washing-machine','Hallway':'door-open','Balcony':'flower-2','Garden':'sprout','Other':'house'};
let people=[{id:1,name:'Jamie',role:'Roommate'},{id:2,name:'Alex',role:'Roommate'},{id:3,name:'Sam',role:'Roommate'}];
let rooms=[{id:1,name:'Kitchen',type:'Kitchen',floor:1},{id:2,name:'Living room',type:'Living room',floor:1},{id:3,name:'Downstairs bathroom',type:'Bathroom',floor:1},{id:4,name:'Jamie’s bedroom',type:'Bedroom',floor:2},{id:5,name:'Alex’s bedroom',type:'Bedroom',floor:2},{id:6,name:'Upstairs bathroom',type:'Bathroom',floor:2}];
let chores=[{id:1,name:'Wipe counters & stovetop',room:1,person:1,time:'10 min',frequency:'Daily',done:false},{id:2,name:'Vacuum the living room',room:2,person:2,time:'20 min',frequency:'Weekly',done:false},{id:3,name:'Clean sink & mirror',room:3,person:3,time:'15 min',frequency:'Weekly',done:false},{id:4,name:'Take out the recycling',room:1,person:2,time:'5 min',frequency:'Weekly',done:true}];
const commonTools=['Vacuum','Broom','Dustpan','Mop','Bucket','Microfiber cloth','Sponge','Scrub brush','Cleaning spray','Glass cleaner','Gloves','Bin bags'];
chores.forEach((c,i)=>c.tools=[['Microfiber cloth','Cleaning spray'],['Vacuum'],['Sponge','Microfiber cloth','Glass cleaner'],['Bin bags']][i]);
let view='chores',choreScope='all',peopleScope='current',editor=null,floors=2,draft=[];let nextId=20;
const dateKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseDate=s=>new Date(s+'T12:00:00');
const addDays=(s,n)=>{const d=parseDate(s);d.setDate(d.getDate()+n);return dateKey(d)};
const today=dateKey(new Date());
const weekStart=s=>addDays(s,-((parseDate(s).getDay()+6)%7));
let planningWeek=weekStart(today),planningMode='scheduled';
chores.forEach((c,i)=>{c.scheduled=addDays(planningWeek,[6,5,4,2][i]);c.doneOn=c.done?c.scheduled:null;c.doneBy=c.done?'Alex':null});
const shortDate=s=>parseDate(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
let houses=[{id:1,name:'Maple House',type:'House',floors,people,rooms,chores,responsibleId:1},{id:2,name:'City Apartment',type:'Apartment',floors:1,people:[{id:101,name:'Jamie',role:'Family member'},{id:102,name:'Morgan',role:'Roommate'}],rooms:[{id:101,name:'Kitchen',type:'Kitchen',floor:1},{id:102,name:'Living room',type:'Living room',floor:1},{id:103,name:'Main bedroom',type:'Bedroom',floor:1},{id:104,name:'Bathroom',type:'Bathroom',floor:1}],chores:[{id:101,name:'Mop the kitchen floor',room:101,person:102,time:'20 min',frequency:'Weekly',tools:['Mop','Bucket'],scheduled:addDays(planningWeek,2),done:false,doneOn:null,doneBy:null},{id:102,name:'Clean the bathroom',room:104,person:101,time:'30 min',frequency:'Weekly',tools:['Sponge','Cleaning spray','Gloves'],scheduled:addDays(planningWeek,5),done:false,doneOn:null,doneBy:null}],responsibleId:101}];
let currentHouseId=1,houseCreator=false;
const currentHouse=()=>houses.find(h=>h.id===currentHouseId);
const responsibleFor=h=>h.people.find(p=>p.id===h.responsibleId)||h.people[0]||null;
const activeUserId=()=>people.find(p=>p.name==='Jamie')?.id??people[0]?.id??0;
function saveCurrentHouse(){const h=currentHouse();if(h)Object.assign(h,{floors,people,rooms,chores})}
function switchHouse(id){saveCurrentHouse();const h=houses.find(h=>h.id===id);if(!h)return;currentHouseId=h.id;floors=h.floors;people=h.people;rooms=h.rooms;chores=h.chores;planningWeek=weekStart(today);planningMode='scheduled';editor=null;houseCreator=false;root.querySelector('#hc-house-menu').hidden=true;root.querySelector('#hc-house-switcher').setAttribute('aria-expanded','false');feedback('Now viewing '+h.name+'.');render()}
let notificationId=4;
let notifications=[
{id:1,title:'Vacuum the living room is due today',detail:'Alex · Living room · 20 min',read:false},
{id:2,title:'A chore was assigned to you',detail:'Wipe counters & stovetop · Today',read:false},
{id:3,title:'Alex completed the recycling',detail:'Completed earlier this week',read:true}
];
let notificationPrefs={assignments:true,reminders:true,completions:true};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name)=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
const options=(arr,value)=>arr.map(x=>'<option value="'+esc(x.id??x)+'" '+((x.id??x)==value?'selected':'')+'>'+esc(x.name??x)+'</option>').join('');
const repeatOptions=['One-off','Daily','Weekly','Monthly'];
const repeatControl=c=>'<label class="hc-repeat"><span>Repeats</span><select data-repeat="'+c.id+'" aria-label="Recurrence for '+esc(c.name)+'">'+options(repeatOptions,c.frequency)+'</select></label>';
const feedback=t=>root.querySelector('#hc-feedback').textContent=t;
function addNotification(title,detail,kind='reminders'){
if(!notificationPrefs[kind])return;
notifications.unshift({id:notificationId++,title,detail,read:false});
renderNotifications();
}
function renderNotifications(){
const panel=root.querySelector('#hc-notifications'),count=root.querySelector('#hc-notification-count'),unread=notifications.filter(n=>!n.read).length;
count.textContent=unread>9?'9+':String(unread);count.hidden=!unread;
panel.innerHTML='<div class="hc-notification-head"><h2>Notifications</h2><button type="button" data-notification-action="read-all" '+(!unread?'disabled':'')+'>Mark all read</button></div><ul class="hc-notification-list">'+notifications.map(n=>'<li><button type="button" class="hc-notification-item" data-notification-id="'+n.id+'" aria-pressed="'+n.read+'"><span class="hc-notification-dot" aria-hidden="true"></span><span><strong>'+esc(n.title)+'</strong><small>'+esc(n.detail)+'</small></span></button></li>').join('')+'</ul><details class="hc-notification-settings"><summary>Notification preferences</summary><div class="hc-pref-list"><label><input type="checkbox" data-notification-pref="assignments" '+(notificationPrefs.assignments?'checked':'')+'>Assignments</label><label><input type="checkbox" data-notification-pref="reminders" '+(notificationPrefs.reminders?'checked':'')+'>Due-date reminders</label><label><input type="checkbox" data-notification-pref="completions" '+(notificationPrefs.completions?'checked':'')+'>Completion updates</label></div></details>';
root.querySelector('#hc-notification-button').setAttribute('aria-label','Notifications'+(unread?' ('+unread+' unread)':''));
}
function renderHouseMenu(){
const h=currentHouse(),menu=root.querySelector('#hc-house-menu');
root.querySelector('#hc-house-name').textContent=h.name;
root.querySelector('#hc-house-info').textContent=people.length+' people · '+rooms.length+' rooms · '+floors+' floor'+(floors===1?'':'s');
root.querySelector('#hc-house-owner').textContent='Responsible · '+(responsibleFor(h)?.name||'Not assigned');
root.querySelector('#hc-current-house-breadcrumb').textContent=h.name;
if(houseCreator){menu.innerHTML='<form class="hc-space-form" id="hc-space-form"><div class="hc-space-form-head"><h2>New shared space</h2><button type="button" class="hc-quiet" data-space-action="cancel" aria-label="Cancel creating shared space">'+icon('x')+'</button></div><label>Space name<input name="name" required maxlength="45" placeholder="e.g. Lake House"></label><label>Type<select name="type">'+options(['House','Apartment','Shared house','Other'],'Apartment')+'</select></label><div class="hc-space-form-row"><label>Floors<input name="floors" type="number" min="1" max="6" value="1" required></label><label>Rooms<input name="rooms" type="number" min="1" max="24" value="4" required></label></div><button class="hc-button hc-primary hc-create-space">Create shared space</button></form>';return}
menu.innerHTML='<div class="hc-space-list">'+houses.map(space=>'<button type="button" class="hc-space-option" data-house-id="'+space.id+'" aria-current="'+(space.id===currentHouseId)+'"><span class="hc-space-icon">'+icon(space.type==='Apartment'?'building-2':space.type==='Shared house'?'users':'house')+'</span><span><strong>'+esc(space.name)+'</strong><small>'+esc(space.type)+' · Responsible: '+esc(responsibleFor(space)?.name||'Not assigned')+'</small><small>'+space.people.length+' people · '+space.rooms.length+' rooms</small></span></button>').join('')+'</div><button type="button" class="hc-button hc-create-space" data-space-action="create">'+icon('plus')+' Create another shared space</button>';
}
const head=(title,sub,button)=>'<div class="hc-heading"><div><h1>'+title+'</h1><p>'+sub+'</p></div>'+button+'</div>';
const button=(label,action,primary=false)=>'<button class="hc-button '+(primary?'hc-primary':'')+'" data-action="'+action+'">'+label+'</button>';
function allMembers(){const map=new Map();houses.forEach(h=>h.people.forEach(person=>{const key=person.name.trim().toLowerCase();if(!map.has(key))map.set(key,{key,name:person.name,role:person.role,memberships:[]});map.get(key).memberships.push({house:h,person})}));return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name))}
function render(){
saveCurrentHouse();renderHouseMenu();
root.querySelector('#hc-breadcrumb').textContent={chores:'Chores',planning:'Planning',people:'People',home:'Our home'}[view];
root.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
let html='';
if(view==='chores'){
const visibleChores=choreScope==='mine'?chores.filter(c=>c.person===activeUserId()):chores;
const done=visibleChores.filter(c=>c.done).length;
html=head('A home we care for, together.','Small tasks. Shared responsibility.',button(icon('plus')+' Add chore','add-chore',true));
if(editor==='chore')html+=choreForm();
if(editor?.kind==='tools')html+=toolsForm(chores.find(c=>c.id===editor.id));
html+='<div class="hc-chore-tabs" role="group" aria-label="Chore board view"><button type="button" data-scope="all" aria-pressed="'+(choreScope==='all')+'">All chores <span>'+chores.length+'</span></button><button type="button" data-scope="mine" aria-pressed="'+(choreScope==='mine')+'">My tasks <span>'+chores.filter(c=>c.person===activeUserId()).length+'</span></button></div>';
html+='<div class="hc-banner"><div><h2>'+(choreScope==='mine'?'Your little part in a happier home':'Every little bit makes a difference')+'</h2><p>'+done+' of '+visibleChores.length+' chores complete '+(choreScope==='mine'?'on your personal board':'on your shared board')+'</p><div class="hc-progress" role="progressbar" aria-label="Chores completed" aria-valuenow="'+done+'" aria-valuemin="0" aria-valuemax="'+Math.max(1,visibleChores.length)+'"><span style="width:'+(visibleChores.length?done/visibleChores.length*100:0)+'%"></span></div></div><div class="hc-score">'+done+' / '+visibleChores.length+'</div></div><div class="hc-section-title"><h2>'+(choreScope==='mine'?'My tasks':'Your shared chore board')+'</h2><span class="hc-label">'+(visibleChores.length-done)+' to do</span></div>';
if(!visibleChores.length)html+='<p class="hc-empty">'+(choreScope==='mine'?'No chores assigned to you yet. Assign yourself a chore from All chores, or add a new one.':'No chores yet. Add a chore to start sharing the load.')+'</p>';
html+='<div class="hc-grid">';
html+=visibleChores.map(c=>{const r=rooms.find(r=>r.id===c.room),p=people.find(p=>p.id===c.person);return '<article class="hc-task '+(c.done?'hc-done':'')+'"><div class="hc-task-top"><span class="hc-room-icon">'+icon(icons[r?.type]||'house')+'</span>'+repeatControl(c)+'</div><h2>'+esc(c.name)+'</h2><p>'+esc(r?.name||'Choose a room')+' · '+esc(c.time)+'</p><div class="hc-tools"><div class="hc-tools-head"><span>Tools & supplies</span><button class="hc-edit-tools" data-edit-tools="'+c.id+'" aria-label="Edit tools for '+esc(c.name)+'">Edit</button></div><div class="hc-tool-list">'+(c.tools.length?c.tools.map(t=>'<span class="hc-tool-pill">'+esc(t)+'</span>').join(''):'<span class="hc-label">No tools needed</span>')+'</div></div><div class="hc-task-bottom"><div class="hc-assignee"><span class="hc-avatar" data-avatar="'+c.id+'">'+esc(p?.name[0]||'?')+'</span><select data-assign="'+c.id+'" aria-label="Assign '+esc(c.name)+'"><option value="0">Unassigned</option>'+options(people,c.person)+'</select></div><button class="hc-check" data-complete="'+c.id+'" aria-label="'+(c.done?'Reopen ':'Complete ')+esc(c.name)+'" aria-pressed="'+c.done+'">'+icon('check')+'</button></div></article>'}).join('');
html+='</div>';
}else if(view==='planning'){
html=planningView();
}else if(view==='people'){
html=head(peopleScope==='all'?'Everyone, across every space.':'Everyone has a place.',peopleScope==='all'?'Manage tenants and family memberships from one directory.':'Manage the people who make this shared space a home.',button(icon('plus')+(peopleScope==='all'?' Add person':' Add person'),peopleScope==='all'?'add-all-person':'add-person',true));
html+='<div class="hc-chore-tabs" role="group" aria-label="People directory view"><button type="button" data-people-scope="current" aria-pressed="'+(peopleScope==='current')+'">'+esc(currentHouse().name)+'</button><button type="button" data-people-scope="all" aria-pressed="'+(peopleScope==='all')+'">All people <span>'+allMembers().length+'</span></button></div>';
if(editor?.kind==='person')html+=personForm();
if(editor?.kind==='all-person')html+=globalPersonForm();
if(peopleScope==='current'){
html+='<div class="hc-grid">'+people.map(p=>{const assigned=chores.filter(c=>c.person===p.id),isResponsible=currentHouse().responsibleId===p.id;return '<article class="hc-member"><div class="hc-member-head"><span class="hc-avatar">'+esc(p.name[0])+'</span><div><h2>'+esc(p.name)+'</h2><p class="hc-label">'+esc(p.role)+'</p>'+(isResponsible?'<span class="hc-owner-badge">'+icon('shield-check')+' Home responsible</span>':'')+'</div></div><div class="hc-member-footer"><span class="hc-label">'+assigned.filter(c=>!c.done).length+' chores to do · '+assigned.filter(c=>c.done).length+' done</span><button class="hc-quiet" data-edit-person="'+p.id+'" aria-label="Edit '+esc(p.name)+'">'+icon('pencil')+'</button></div></article>'}).join('')+'</div>';
if(!people.length)html+='<p class="hc-empty">Add a family member or roommate to start sharing chores.</p>';
}else{
const members=allMembers();html+='<div class="hc-grid">'+members.map(member=>{const assigned=member.memberships.reduce((sum,m)=>sum+m.house.chores.filter(c=>c.person===m.person.id&&!c.done).length,0);return '<article class="hc-member"><div class="hc-member-head"><span class="hc-avatar">'+esc(member.name[0])+'</span><div><h2>'+esc(member.name)+'</h2><p class="hc-label">'+esc(member.role)+'</p><div class="hc-member-spaces">'+member.memberships.map(m=>'<span>'+esc(m.house.name)+(m.house.responsibleId===m.person.id?' · Responsible':'')+'</span>').join('')+'</div></div></div><div class="hc-member-footer"><span class="hc-label">'+assigned+' chores to do · '+member.memberships.length+' space'+(member.memberships.length===1?'':'s')+'</span><button class="hc-quiet" data-manage-person="'+esc(encodeURIComponent(member.key))+'" aria-label="Manage '+esc(member.name)+'">'+icon('settings-2')+'</button></div></article>'}).join('')+'</div>';if(!members.length)html+='<p class="hc-empty">Add a person and choose which shared spaces they belong to.</p>';
}
}else{
html=head('A place for every chore.','Organize your home by floor and room.',button(icon('settings-2')+' Set up home','setup',true));
const responsible=responsibleFor(currentHouse());html+='<section class="hc-responsible" aria-label="Home responsible"><div class="hc-responsible-info"><span>'+icon('shield-check')+'</span><span><strong>'+esc(responsible?.name||'No responsible person')+'</strong><small>Responsible for '+esc(currentHouse().name)+'</small></span></div><label>Change responsible<select data-house-owner aria-label="Responsible person for '+esc(currentHouse().name)+'">'+options(people,responsible?.id||0)+'</select></label></section>';
if(editor==='setup')html+=setupForm();
else if(editor==='rooms')html+=roomsForm();
else for(let f=1;f<=floors;f++){html+='<section class="hc-floor"><h2>'+floorName(f)+'</h2><div class="hc-grid">'+rooms.filter(r=>r.floor===f).map(r=>'<div class="hc-room"><span class="hc-room-icon">'+icon(icons[r.type])+'</span><div><h2>'+esc(r.name)+'</h2><p>'+esc(r.type)+' · '+chores.filter(c=>c.room===r.id&&!c.done).length+' chores to do</p></div></div>').join('')+'</div></section>'}
}
content.innerHTML=html;renderNotifications();if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
}
function floorName(f){return f===1?'Ground floor':'Floor '+f}
function planningView(){
let html=head('A little plan. A lighter week.','See what’s coming up and what got done, day by day.',button(icon('calendar-plus')+' Schedule chore','schedule',true));
if(editor==='schedule')html+=scheduleForm();
html+='<div class="hc-week-toolbar"><div><h2>'+shortDate(planningWeek)+' – '+shortDate(addDays(planningWeek,6))+', '+parseDate(addDays(planningWeek,6)).getFullYear()+'</h2><span class="hc-label">Monday to Sunday</span></div><div class="hc-week-actions"><button class="hc-button" data-week="-1" aria-label="Previous week">'+icon('chevron-left')+'<span>Previous</span></button><button class="hc-button" data-week="today">This week</button><button class="hc-button" data-week="1" aria-label="Next week"><span>Next</span>'+icon('chevron-right')+'</button></div></div>';
html+='<div class="hc-chore-tabs" role="group" aria-label="Planning view"><button data-planning-mode="scheduled" aria-pressed="'+(planningMode==='scheduled')+'">Scheduled</button><button data-planning-mode="completed" aria-pressed="'+(planningMode==='completed')+'">Completed</button></div><div class="hc-week-grid">';
for(let i=0;i<7;i++){const day=addDays(planningWeek,i),items=chores.filter(c=>planningMode==='scheduled'?c.scheduled===day:c.done&&c.doneOn===day);
html+='<section class="hc-day" data-day="'+day+'"><div class="hc-day-heading"><h2>'+parseDate(day).toLocaleDateString('en-US',{weekday:'long'})+'</h2><span class="hc-label">'+shortDate(day)+(day===today?' · Today':'')+'</span></div>';
html+=items.length?items.map(c=>{const r=rooms.find(r=>r.id===c.room),p=people.find(p=>p.id===c.person);return '<article class="hc-plan-task"><h3>'+esc(c.name)+'</h3><p>'+esc(r?.name||'No room')+' · '+esc(c.time)+'</p><div class="hc-plan-person"><span class="hc-avatar">'+esc((planningMode==='completed'?c.doneBy:p?.name)?.[0]||'?')+'</span><span>'+esc(planningMode==='completed'?c.doneBy||'Household member':p?.name||'Unassigned')+'</span><button class="hc-check" data-complete="'+c.id+'" aria-label="'+(c.done?'Reopen ':'Complete ')+esc(c.name)+'" aria-pressed="'+c.done+'">'+icon('check')+'</button></div><div class="hc-plan-status">'+(c.done?'Completed '+shortDate(c.doneOn):'To do')+'</div>'+repeatControl(c)+(planningMode==='scheduled'?'<label class="hc-plan-date">Scheduled for<input type="date" value="'+c.scheduled+'" data-schedule="'+c.id+'" aria-label="Schedule '+esc(c.name)+'"></label>':'')+'</article>'}).join(''):'<p class="hc-day-empty">'+(planningMode==='scheduled'?'Nothing scheduled':'No completed chores')+'</p>';
html+='</section>'}
return html+'</div>';
}
function scheduleForm(){return '<form class="hc-form" id="hc-schedule-form"><div class="hc-form-head"><h2>Choose a chore and a day</h2>'+button('Cancel','cancel')+'</div><div class="hc-fields"><label>Chore<select name="chore" required>'+options(chores,chores[0]?.id)+'</select></label><label>Scheduled for<input type="date" name="scheduled" value="'+today+'" required></label></div><div class="hc-actions"><button class="hc-button hc-primary" '+(!chores.length?'disabled':'')+'>Save schedule</button></div></form>'}
function toolFields(selected=[]){return '<fieldset class="hc-tool-fields"><legend>Tools & supplies</legend><div class="hc-tool-options">'+commonTools.map(t=>'<label class="hc-tool-option"><input type="checkbox" name="tools" value="'+esc(t)+'" '+(selected.includes(t)?'checked':'')+'>'+esc(t)+'</label>').join('')+'</div><label>Other items (separate with commas)<input name="extra-tools" maxlength="240" value="'+esc(selected.filter(t=>!commonTools.includes(t)).join(', '))+'" placeholder="e.g. Watering can, duster"></label></fieldset>'}
function readTools(data){const all=[...data.getAll('tools'),...String(data.get('extra-tools')||'').split(',')].map(t=>t.trim()).filter(Boolean);return all.filter((t,i)=>all.findIndex(x=>x.toLowerCase()===t.toLowerCase())===i)}
function toolsForm(c){return '<form class="hc-form" id="hc-tools-form"><div class="hc-form-head"><h2>Tools for '+esc(c.name)+'</h2>'+button('Cancel','cancel')+'</div>'+toolFields(c.tools)+'<div class="hc-actions"><button class="hc-button hc-primary">Save tools</button></div></form>'}
function choreForm(){return '<form class="hc-form" id="hc-chore-form"><div class="hc-form-head"><h2>A new chore</h2>'+button('Cancel','cancel')+'</div><div class="hc-fields"><label>Chore name<input name="name" required maxlength="80" placeholder="e.g. Mop the kitchen floor"></label><label>Room / place<select name="room" required>'+options(rooms,rooms[0]?.id)+'</select></label><label>Assign to<select name="person"><option value="0">Unassigned</option>'+options(people,choreScope==='mine'?activeUserId():0)+'</select></label><label>Repeats<select name="frequency">'+options(['Daily','Weekly','Monthly','One-off'],'Weekly')+'</select></label><label>Estimated time<select name="time">'+options(['5 min','10 min','15 min','20 min','30 min','45 min','60 min'],'15 min')+'</select></label><label>Scheduled for<input type="date" name="scheduled" value="'+today+'" required></label></div>'+toolFields()+'<div class="hc-actions"><button class="hc-button hc-primary" '+(!rooms.length?'disabled':'')+'>Create chore</button></div></form>'}
function personForm(){const p=people.find(p=>p.id===editor.id);return '<form class="hc-form" id="hc-person-form"><div class="hc-form-head"><h2>'+(p?'Edit person':'Add someone to your home')+'</h2>'+button('Cancel','cancel')+'</div><div class="hc-fields"><label>Name<input name="name" required maxlength="35" value="'+esc(p?.name||'')+'" placeholder="e.g. Taylor"></label><label>Relationship<select name="role">'+options(['Family member','Roommate'],p?.role||'Roommate')+'</select></label></div><div class="hc-actions">'+(p?button('Remove person','remove-person'):'')+'<button class="hc-button hc-primary">'+(p?'Save changes':'Add person')+'</button></div>'+(p?'<p class="hc-note">Removing a person leaves their chores unassigned.</p>':'')+'</form>'}
function globalPersonForm(){const member=editor.key?allMembers().find(m=>m.key===editor.key):null,memberHouseIds=member?member.memberships.map(m=>m.house.id):[currentHouseId];return '<form class="hc-form" id="hc-global-person-form"><div class="hc-form-head"><h2>'+(member?'Manage '+esc(member.name):'Add a person')+'</h2>'+button('Cancel','cancel')+'</div><div class="hc-fields"><label>Name<input name="name" required maxlength="35" value="'+esc(member?.name||'')+'" placeholder="e.g. Taylor"></label><label>Relationship<select name="role">'+options(['Family member','Roommate'],member?.role||'Roommate')+'</select></label></div><fieldset class="hc-membership-list"><legend>Shared-space membership</legend><div class="hc-membership-options">'+houses.map(h=>'<label><input type="checkbox" name="houses" value="'+h.id+'" '+(memberHouseIds.includes(h.id)?'checked':'')+'>'+esc(h.name)+'</label>').join('')+'</div></fieldset><div class="hc-actions">'+(member?button('Remove from all spaces','remove-all-person'):'')+'<button class="hc-button hc-primary">'+(member?'Save memberships':'Add person')+'</button></div>'+(member?'<p class="hc-note">Removing a membership leaves that person’s chores unassigned in the affected space.</p>':'')+'</form>'}
function setupForm(){return '<form class="hc-form" id="hc-setup-form"><div class="hc-step">01 — Your home</div><div class="hc-form-head"><h2>How much space do you share?</h2>'+button('Cancel','cancel')+'</div><div class="hc-fields"><label>Number of floors<input type="number" name="floors" min="1" max="6" required value="'+floors+'"></label><label>Total rooms / places<input type="number" name="rooms" min="1" max="24" required value="'+rooms.length+'"></label></div><p class="hc-note">Include shared spaces such as a garden, balcony, or laundry room.</p><div class="hc-actions"><button class="hc-button hc-primary">Next: name your rooms '+icon('arrow-right')+'</button></div></form>'}
function roomsForm(){return '<form class="hc-form" id="hc-rooms-form"><div class="hc-step">02 — Rooms & places</div><div class="hc-form-head"><h2>Give each space a home</h2>'+button('Cancel','cancel')+'</div>'+draft.map((r,i)=>'<div class="hc-room-row"><label>Room '+(i+1)+' name<input name="name-'+i+'" required maxlength="45" value="'+esc(r.name)+'" placeholder="Room name"></label><label>Room type<select name="type-'+i+'">'+options(types,r.type)+'</select></label><label>Floor<select name="floor-'+i+'">'+options(Array.from({length:editorFloors},(_,i)=>({id:i+1,name:floorName(i+1)})),Math.min(r.floor,editorFloors))+'</select></label></div>').join('')+'<p class="hc-note">Existing chore assignments are kept. Chores in removed rooms move to your first room.</p><div class="hc-actions">'+button('Back','back-setup')+'<button class="hc-button hc-primary">Save home</button></div></form>'}
let editorFloors=floors;
root.addEventListener('click',e=>{
const userButton=e.target.closest('#hc-user-button');if(userButton){const menu=root.querySelector('#hc-user-menu'),open=menu.hidden;menu.hidden=!open;userButton.setAttribute('aria-expanded',String(open));return}
const userAction=e.target.closest('[data-user-action]');if(userAction){root.querySelector('#hc-user-menu').hidden=true;root.querySelector('#hc-user-button').setAttribute('aria-expanded','false');if(userAction.dataset.userAction==='notifications'){const panel=root.querySelector('#hc-notifications');panel.hidden=false;root.querySelector('#hc-notification-button').setAttribute('aria-expanded','true');const details=panel.querySelector('details');if(details)details.open=true;return}view='people';peopleScope='all';editor=userAction.dataset.userAction==='profile'?{kind:'all-person',key:'jamie'}:null;feedback('');render();return}
const houseSwitcher=e.target.closest('#hc-house-switcher');if(houseSwitcher){const menu=root.querySelector('#hc-house-menu'),open=menu.hidden;menu.hidden=!open;houseSwitcher.setAttribute('aria-expanded',String(open));return}
const houseOption=e.target.closest('[data-house-id]');if(houseOption){switchHouse(+houseOption.dataset.houseId);return}
const spaceAction=e.target.closest('[data-space-action]');if(spaceAction){houseCreator=spaceAction.dataset.spaceAction==='create';renderHouseMenu();if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});return}
const notificationButton=e.target.closest('#hc-notification-button');if(notificationButton){const panel=root.querySelector('#hc-notifications'),open=panel.hidden;panel.hidden=!open;notificationButton.setAttribute('aria-expanded',String(open));return}
const notification=e.target.closest('[data-notification-id]');if(notification){const item=notifications.find(n=>n.id===+notification.dataset.notificationId);item.read=true;renderNotifications();return}
const notificationAction=e.target.closest('[data-notification-action]');if(notificationAction){notifications.forEach(n=>n.read=true);renderNotifications();feedback('All notifications marked as read.');return}
const week=e.target.closest('[data-week]');if(week){planningWeek=week.dataset.week==='today'?weekStart(today):addDays(planningWeek,+week.dataset.week*7);editor=null;feedback('');render();return}
const peopleScopeButton=e.target.closest('[data-people-scope]');if(peopleScopeButton){peopleScope=peopleScopeButton.dataset.peopleScope;editor=null;feedback('');render();root.querySelector('[data-people-scope="'+peopleScope+'"]').focus();return}
const mode=e.target.closest('[data-planning-mode]');if(mode){planningMode=mode.dataset.planningMode;editor=null;feedback('');render();root.querySelector('[data-planning-mode="'+planningMode+'"]').focus();return}
const scope=e.target.closest('[data-scope]');if(scope){choreScope=scope.dataset.scope;editor=null;feedback('');render();root.querySelector('[data-scope="'+choreScope+'"]').focus();return}
const nav=e.target.closest('[data-view]');if(nav){view=nav.dataset.view;editor=null;feedback('');render();return}
const completed=e.target.closest('[data-complete]');if(completed){const c=chores.find(c=>c.id===+completed.dataset.complete);c.done=!c.done;c.doneOn=c.done?dateKey(new Date()):null;c.doneBy=c.done?(people.find(p=>p.id===activeUserId())?.name||'Jamie'):null;addNotification(c.done?'Chore completed':'Chore reopened',c.name,c.done?'completions':'reminders');feedback(c.done?'Nice work! '+c.name+' is complete.':c.name+' moved back to to do.');render();return}
const edit=e.target.closest('[data-edit-person]');if(edit){editor={kind:'person',id:+edit.dataset.editPerson};render();return}
const managePerson=e.target.closest('[data-manage-person]');if(managePerson){editor={kind:'all-person',key:decodeURIComponent(managePerson.dataset.managePerson)};render();return}
const editTools=e.target.closest('[data-edit-tools]');if(editTools){editor={kind:'tools',id:+editTools.dataset.editTools};render();return}
const action=e.target.closest('[data-action]');if(!action)return;e.preventDefault();
switch(action.dataset.action){case 'add-chore':editor='chore';break;case 'add-person':editor={kind:'person'};break;case 'add-all-person':editor={kind:'all-person',key:null};break;case 'cancel':editor=null;break;case 'setup':editor='setup';break;case 'back-setup':editor='setup';break;case 'remove-person':{const id=editor.id;people=people.filter(p=>p.id!==id);chores.forEach(c=>{if(c.person===id)c.person=0});if(currentHouse().responsibleId===id)currentHouse().responsibleId=people[0]?.id||null;editor=null;feedback('Person removed. Their chores are now unassigned.');break}case 'remove-all-person':{const key=editor.key;houses.forEach(h=>{const removed=h.people.find(p=>p.name.trim().toLowerCase()===key);if(removed){h.people=h.people.filter(p=>p.id!==removed.id);h.chores.forEach(c=>{if(c.person===removed.id)c.person=0});if(h.responsibleId===removed.id)h.responsibleId=h.people[0]?.id||null}});const active=currentHouse();people=active.people;editor=null;feedback('Person removed from every shared space.');break}}
if(action.dataset.action==='schedule'){editor='schedule';planningMode='scheduled'}
render();
});
root.addEventListener('change',e=>{if(e.target.matches('[data-notification-pref]')){notificationPrefs[e.target.dataset.notificationPref]=e.target.checked;feedback(e.target.checked?'Notification enabled.':'Notification muted.');return}if(e.target.matches('[data-house-owner]')){const h=currentHouse(),p=people.find(p=>p.id===+e.target.value);h.responsibleId=p?.id||null;addNotification('Home responsible updated',h.name+' · '+(p?.name||'Not assigned'),'assignments');feedback((p?.name||'No one')+' is now responsible for '+h.name+'.');render();return}if(e.target.matches('[data-assign]')){const c=chores.find(c=>c.id===+e.target.dataset.assign);c.person=+e.target.value;const p=people.find(p=>p.id===c.person);addNotification('Assignment updated',c.name+' · '+(p?.name||'Unassigned'),'assignments');feedback(c.name+' assigned to '+(p?.name||'no one')+'.');render()}});
root.addEventListener('change',e=>{if(e.target.matches('[data-repeat]')){const c=chores.find(c=>c.id===+e.target.dataset.repeat);c.frequency=e.target.value;addNotification('Recurrence updated',c.name+' · '+c.frequency,'reminders');feedback(c.name+' now repeats '+(c.frequency==='One-off'?'once':c.frequency.toLowerCase())+'.');render()}});
root.addEventListener('change',e=>{if(e.target.matches('[data-schedule]')){const c=chores.find(c=>c.id===+e.target.dataset.schedule);if(!e.target.value){e.target.value=c.scheduled;feedback('Choose a date to reschedule this chore.');return}c.scheduled=e.target.value;addNotification('Chore rescheduled',c.name+' · '+shortDate(c.scheduled),'reminders');feedback(c.name+' moved to '+shortDate(c.scheduled)+'.');render()}});
root.addEventListener('submit',e=>{
e.preventDefault();const data=new FormData(e.target);
if(e.target.id==='hc-space-form'){const name=data.get('name').trim(),newFloors=+data.get('floors'),roomCount=+data.get('rooms');if(!name){feedback('Please name the shared space.');return}saveCurrentHouse();const newRooms=Array.from({length:roomCount},(_,i)=>({id:nextId++,name:'Room '+(i+1),type:'Other',floor:(i%newFloors)+1})),creator={id:nextId++,name:'Jamie',role:'Family member'};const space={id:nextId++,name,type:data.get('type'),floors:newFloors,people:[creator],rooms:newRooms,chores:[],responsibleId:creator.id};houses.push(space);addNotification('Shared space created',name+' · '+space.type,'assignments');switchHouse(space.id);return}
if(e.target.id==='hc-schedule-form'){const c=chores.find(c=>c.id===+data.get('chore'));c.scheduled=data.get('scheduled');planningWeek=weekStart(c.scheduled);editor=null;feedback(c.name+' scheduled for '+shortDate(c.scheduled)+'.')}
if(e.target.id==='hc-chore-form'){const name=data.get('name').trim();if(!name){feedback('Please enter a chore name.');return}chores.push({id:nextId++,name,room:+data.get('room'),person:+data.get('person'),frequency:data.get('frequency'),time:data.get('time'),tools:readTools(data),scheduled:data.get('scheduled')||today,doneOn:null,doneBy:null,done:false});editor=null;feedback('Chore added to your shared board.')}
if(e.target.id==='hc-tools-form'){const c=chores.find(c=>c.id===editor.id);c.tools=readTools(data);editor=null;feedback('Tools updated for '+c.name+'.')}
if(e.target.id==='hc-person-form'){const name=data.get('name').trim();if(!name){feedback('Please enter a name.');return}const p=people.find(p=>p.id===editor.id);if(p){p.name=name;p.role=data.get('role')}else people.push({id:nextId++,name,role:data.get('role')});editor=null;feedback('Your household has been updated.')}
if(e.target.id==='hc-global-person-form'){const name=data.get('name').trim(),selected=data.getAll('houses').map(Number),oldKey=editor.key;if(!name){feedback('Please enter a name.');return}if(!selected.length){feedback('Choose at least one shared space.');return}houses.forEach(h=>{const existing=oldKey?h.people.find(p=>p.name.trim().toLowerCase()===oldKey):null;if(selected.includes(h.id)){if(existing){existing.name=name;existing.role=data.get('role')}else h.people.push({id:nextId++,name,role:data.get('role')})}else if(existing){h.people=h.people.filter(p=>p.id!==existing.id);h.chores.forEach(c=>{if(c.person===existing.id)c.person=0});if(h.responsibleId===existing.id)h.responsibleId=h.people[0]?.id||null}});const active=currentHouse();people=active.people;editor=null;addNotification('People directory updated',name+' · '+selected.length+' shared space'+(selected.length===1?'':'s'),'assignments');feedback('Memberships updated for '+name+'.')}
if(e.target.id==='hc-setup-form'){editorFloors=+data.get('floors');draft=Array.from({length:+data.get('rooms')},(_,i)=>rooms[i]?{...rooms[i]}:{id:nextId++,name:'',type:'Bedroom',floor:1});editor='rooms';feedback('')}
if(e.target.id==='hc-rooms-form'){if(draft.some((r,i)=>!data.get('name-'+i).trim())){feedback('Please name every room.');return}rooms=draft.map((r,i)=>({...r,name:data.get('name-'+i).trim(),type:data.get('type-'+i),floor:+data.get('floor-'+i)}));floors=editorFloors;chores.forEach(c=>{if(!rooms.some(r=>r.id===c.room))c.room=rooms[0].id});editor=null;feedback('Your home is ready. Assign chores to any room.')}
render();
});
render();
if(globalThis.Tweak){const design={rounded:14,compact:false};const tweak=new Tweak({container:root,onChange:()=>{root.style.borderRadius=design.rounded+'px';root.querySelector('.hc-main').style.padding=design.compact?'20px':'28px 30px'}});tweak.addSlider(design,'rounded',{label:'App corner radius',min:0,max:28,unit:'px'});tweak.addToggle(design,'compact',{label:'Compact spacing'})}
})();
</script>
</div>
</body>
</html>
